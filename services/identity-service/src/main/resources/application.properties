spring.application.name=identity-service

#PostgreSQL
spring.datasource.url=jdbc:postgresql://${IDENTITY_DB_HOST}:${IDENTITY_DB_PORT}/${IDENTITY_DB_NAME}?currentSchema=${IDENTITY_DB_SCHEMA}
spring.datasource.username=${IDENTITY_DB_USER}
spring.datasource.password=${IDENTITY_DB_PASSWORD}

# Flyway
spring.flyway.enabled=true
spring.flyway.default-schema=${IDENTITY_DB_SCHEMA}
spring.flyway.schemas=${IDENTITY_DB_SCHEMA}
spring.flyway.locations=classpath:db/migrations

# Server
server.port=${SERVER_PORT}

# Actuator
management.endpoints.web.exposure.include=health,info